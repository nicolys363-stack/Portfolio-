<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="drnick-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f1f38" />
      <stop offset="100%" stop-color="#062238" />
    </linearGradient>
    <linearGradient id="drnick-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="drnick-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#drnick-bg)" rx="12" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
  </g>

  <!-- Glow Orb -->
  <circle cx="500" cy="80" r="120" fill="#06B6D4" opacity="0.15" filter="url(#drnick-glow)" />

  <!-- Mockup Window Frame -->
  <rect x="40" y="35" width="520" height="310" rx="10" fill="#0d182e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="35" width="520" height="34" rx="10" fill="#0a1224" />
  <rect x="40" y="60" width="520" height="9" fill="#0a1224" />
  <circle cx="62" cy="52" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="78" cy="52" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="94" cy="52" r="4.5" fill="#10B981" opacity="0.8" />
  <rect x="140" y="44" width="320" height="16" rx="8" fill="rgba(255,255,255,0.06)" />
  <text x="300" y="56" fill="#94A3B8" font-size="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle">dr-nick.netlify.app</text>

  <!-- App Header / Logo -->
  <g transform="translate(65, 85)">
    <rect width="28" height="28" rx="8" fill="url(#drnick-accent)" />
    <!-- Medical Cross / Tech Symbol -->
    <path d="M14 8 V20 M8 14 H20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <text x="38" y="19" fill="#FFFFFF" font-size="16" font-weight="bold" font-family="'Outfit', system-ui, sans-serif">Dr. Nick</text>
    <text x="105" y="19" fill="#06B6D4" font-size="10" font-weight="600" font-family="system-ui">Google Antigravity</text>
  </g>

  <!-- Content Cards -->
  <g transform="translate(65, 130)">
    <!-- Left Hero Card -->
    <rect width="280" height="185" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="16" y="18" width="130" height="12" rx="4" fill="url(#drnick-accent)" />
    <rect x="16" y="38" width="220" height="8" rx="3" fill="rgba(255,255,255,0.4)" />
    <rect x="16" y="52" width="180" height="8" rx="3" fill="rgba(255,255,255,0.2)" />
    
    <!-- Pulse Line -->
    <path d="M16 110 L60 110 L75 80 L90 140 L105 95 L120 110 L250 110" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- CTA Button -->
    <rect x="16" y="138" width="110" height="28" rx="6" fill="url(#drnick-accent)" />
    <text x="71" y="156" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">Agendar Consulta</text>
  </g>

  <!-- Right Sidebar Cards -->
  <g transform="translate(365, 130)">
    <rect width="170" height="85" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="rgba(6,182,212,0.2)" />
    <path d="M26 32 L30 36 L38 28" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <rect x="55" y="24" width="90" height="8" rx="3" fill="#FFFFFF" opacity="0.8" />
    <rect x="55" y="38" width="65" height="6" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="16" y="58" width="138" height="14" rx="4" fill="rgba(6,182,212,0.15)" />
    <text x="85" y="69" fill="#38BDF8" font-size="8" font-weight="600" text-anchor="middle" font-family="system-ui">Atendimento 24h Ativo</text>
  </g>

  <g transform="translate(365, 230)">
    <rect width="170" height="85" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="32" cy="32" r="14" fill="rgba(99,102,241,0.2)" />
    <path d="M28 26 H36 V38 H28 Z M32 26 V38" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" />
    <rect x="55" y="24" width="80" height="8" rx="3" fill="#FFFFFF" opacity="0.8" />
    <rect x="55" y="38" width="50" height="6" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="16" y="58" width="138" height="14" rx="4" fill="rgba(99,102,241,0.15)" />
    <text x="85" y="69" fill="#A5B4FC" font-size="8" font-weight="600" text-anchor="middle" font-family="system-ui">Interface Google Antigravity</text>
  </g>
</svg>
