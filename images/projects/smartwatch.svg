<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="watch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#1a1128" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="watch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#watch-bg)" rx="12" />

  <!-- Mockup Window -->
  <rect x="40" y="35" width="520" height="310" rx="10" fill="#0c1222" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="35" width="520" height="34" rx="10" fill="#080d1a" />
  <rect x="40" y="60" width="520" height="9" fill="#080d1a" />
  <circle cx="62" cy="52" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="78" cy="52" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="94" cy="52" r="4.5" fill="#10B981" opacity="0.8" />
  <rect x="140" y="44" width="320" height="16" rx="8" fill="rgba(255,255,255,0.06)" />
  <text x="300" y="56" fill="#94A3B8" font-size="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle">pagina-de-vendas-sage.vercel.app</text>

  <!-- Hero Content Left -->
  <g transform="translate(65, 88)">
    <rect width="115" height="18" rx="9" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1" />
    <text x="57" y="12" fill="#FBBF24" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">Lançamento 2026</text>
    
    <text x="0" y="45" fill="#FFFFFF" font-size="20" font-weight="800" font-family="'Outfit', system-ui, sans-serif">Smartwatch Ultra Pro</text>
    <text x="0" y="68" fill="#94A3B8" font-size="11" font-family="system-ui">Design de alta conversão &amp; UX moderna</text>
    
    <!-- Specs badges -->
    <g transform="translate(0, 85)">
      <rect width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
      <text x="35" y="16" fill="#38BDF8" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui">⚡ Bateria 14d</text>
      
      <rect x="78" y="0" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
      <text x="113" y="16" fill="#A855F7" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui">❤️ Sensores</text>
      
      <rect x="156" y="0" width="60" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
      <text x="186" y="16" fill="#10B981" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui">💧 IP68</text>
    </g>

    <!-- Buy Button -->
    <g transform="translate(0, 125)">
      <rect width="140" height="34" rx="8" fill="url(#orange-grad)" />
      <text x="70" y="21" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">Comprar Agora →</text>
      
      <text x="155" y="21" fill="#FBBF24" font-size="14" font-weight="bold" font-family="system-ui">R$ 299,90</text>
    </g>
  </g>

  <!-- Hero Watch Graphic Right -->
  <g transform="translate(375, 95)">
    <!-- Watch Glow -->
    <circle cx="80" cy="95" r="70" fill="#06B6D4" opacity="0.2" filter="url(#watch-glow)" />

    <!-- Watch Straps -->
    <rect x="58" y="10" width="44" height="40" rx="6" fill="#1E293B" />
    <rect x="58" y="140" width="44" height="40" rx="6" fill="#1E293B" />

    <!-- Watch Case -->
    <rect x="36" y="45" width="88" height="100" rx="26" fill="#0F172A" stroke="url(#cyan-glow)" stroke-width="3" />
    
    <!-- Watch Bezel / Screen -->
    <rect x="44" y="53" width="72" height="84" rx="20" fill="#020617" />
    
    <!-- Screen Elements -->
    <text x="80" y="85" fill="#FFFFFF" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Outfit', system-ui">10:42</text>
    <text x="80" y="100" fill="#06B6D4" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui">128 BPM</text>
    <path d="M56 118 C65 110, 75 125, 85 112 C95 122, 104 115, 104 115" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
