<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="todo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="50%" stop-color="#161b33" />
      <stop offset="100%" stop-color="#13172e" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="card-todo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.6)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#todo-bg)" rx="12" />

  <!-- Mockup Window -->
  <rect x="40" y="35" width="520" height="310" rx="10" fill="#0d1424" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="35" width="520" height="34" rx="10" fill="#090e1c" />
  <rect x="40" y="60" width="520" height="9" fill="#090e1c" />
  <circle cx="62" cy="52" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="78" cy="52" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="94" cy="52" r="4.5" fill="#10B981" opacity="0.8" />
  <rect x="140" y="44" width="320" height="16" rx="8" fill="rgba(255,255,255,0.06)" />
  <text x="300" y="56" fill="#94A3B8" font-size="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle">lista-tarefas-842l.vercel.app</text>

  <!-- App Bar -->
  <g transform="translate(65, 85)">
    <rect width="28" height="28" rx="8" fill="url(#purple-grad)" />
    <path d="M9 14 L13 18 L20 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="38" y="19" fill="#FFFFFF" font-size="16" font-weight="bold" font-family="'Outfit', system-ui, sans-serif">Task Manager</text>
    
    <!-- Database Connected Badge -->
    <rect x="330" y="4" width="135" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1" />
    <circle cx="342" cy="15" r="4" fill="#10B981" />
    <text x="352" y="19" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui">Banco de Dados Ativo</text>
  </g>

  <!-- Input Area -->
  <g transform="translate(65, 128)">
    <rect width="365" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="14" y="21" fill="#64748B" font-size="11" font-family="system-ui">Adicionar uma nova tarefa persistente...</text>
    <rect x="380" y="0" width="90" height="34" rx="8" fill="url(#purple-grad)" />
    <text x="425" y="21" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">+ Criar</text>
  </g>

  <!-- Task Items -->
  <g transform="translate(65, 175)">
    <!-- Task 1 (Completed) -->
    <rect width="470" height="42" rx="8" fill="url(#card-todo)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <rect x="14" y="13" width="16" height="16" rx="4" fill="#10B981" />
    <path d="M17 21 L21 24 L27 17" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="42" y="25" fill="#94A3B8" font-size="12" font-family="system-ui" text-decoration="line-through">Integrar persistência com banco de dados</text>
    <rect x="385" y="12" width="72" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" />
    <text x="421" y="24" fill="#34D399" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">Concluída</text>

    <!-- Task 2 (Active) -->
    <g transform="translate(0, 50)">
      <rect width="470" height="42" rx="8" fill="url(#card-todo)" stroke="rgba(99,102,241,0.3)" stroke-width="1" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="none" stroke="#6366F1" stroke-width="2" />
      <text x="42" y="25" fill="#F8FAFC" font-size="12" font-weight="500" font-family="system-ui">Estruturar operações CRUD completas</text>
      <rect x="385" y="12" width="72" height="18" rx="9" fill="rgba(99, 102, 241, 0.2)" />
      <text x="421" y="24" fill="#A5B4FC" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">Em Foco</text>
    </g>

    <!-- Task 3 (Active) -->
    <g transform="translate(0, 100)">
      <rect width="470" height="42" rx="8" fill="url(#card-todo)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="none" stroke="#64748B" stroke-width="2" />
      <text x="42" y="25" fill="#E2E8F0" font-size="12" font-family="system-ui">Otimizar responsividade da interface</text>
      <rect x="385" y="12" width="72" height="18" rx="9" fill="rgba(255, 255, 255, 0.08)" />
      <text x="421" y="24" fill="#94A3B8" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">Pendente</text>
    </g>
  </g>
</svg>
